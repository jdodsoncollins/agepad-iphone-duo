<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1000" viewBox="0 0 640 1000" role="img" aria-labelledby="title desc">
  <title id="title">How AgePad runs on an iPhone or iPad</title>
  <desc id="desc">Your supported Mac game and Steam installation plus AgePad source are privately packaged into a signed device app. The app runs the original ARM64 game and Metal renderer with a UIKit launcher and touch compatibility. Steam CDN assets or a Files folder are verified into a separate app data container and read by the game.</desc>
  <defs>
    <marker id="build-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#8e3434" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="data-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#98703c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #2d2925; text-anchor: middle; font-size: 26px; }
      .label { font-size: 21px; fill: #6d6256; }
      .box { fill: #fff; stroke: #c8b6a0; stroke-width: 2; }
      .build { fill: none; stroke: #8e3434; stroke-width: 3; marker-end: url(#build-arrow); }
      .data { fill: none; stroke: #98703c; stroke-width: 3; marker-end: url(#data-arrow); stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="640" height="1000" rx="14" fill="#fffaf3"/>
  <text class="label" x="320" y="34">BUILD PRIVATELY ON YOUR MAC</text>
  <rect class="box" x="40" y="54" width="560" height="100" rx="12"/>
  <text x="320" y="94">Your supported Mac game + Steam</text>
  <text x="320" y="129">and AgePad source</text>
  <path class="build" d="M320 154 V192"/>
  <rect class="box" x="110" y="192" width="420" height="72" rx="12"/>
  <text x="320" y="237">Private local packaging</text>
  <path class="build" d="M320 264 V302"/>
  <rect x="110" y="302" width="420" height="72" rx="12" fill="#8e3434"/>
  <text x="320" y="347" style="fill:#fff">Signed iPhone / iPad app</text>
  <path class="build" d="M320 374 V416"/>
  <rect x="40" y="416" width="560" height="220" rx="14" fill="#f3ebdf" stroke="#b4966d" stroke-width="2"/>
  <text class="label" x="320" y="453">RUNS ON THE DEVICE</text>
  <rect class="box" x="60" y="474" width="520" height="58" rx="10"/>
  <text x="320" y="511">Original ARM64 game + Metal</text>
  <rect class="box" x="60" y="550" width="520" height="62" rx="10"/>
  <text x="320" y="590">UIKit launcher + touch controls</text>
  <text class="label" x="320" y="697">INSTALL GAME ASSETS SEPARATELY</text>
  <rect class="box" x="110" y="722" width="420" height="80" rx="12"/>
  <text x="320" y="755">Steam CDN assets</text>
  <text x="320" y="787">or Files folder</text>
  <path class="data" d="M320 802 V842"/>
  <rect class="box" x="110" y="842" width="420" height="78" rx="12"/>
  <text x="320" y="890" style="font-size:25px">Verified game-data container</text>
  <path class="data" d="M530 881 H620 V503 H582"/>
  <text class="label" x="320" y="964">Assets stay outside the signed app bundle.</text>
</svg>
